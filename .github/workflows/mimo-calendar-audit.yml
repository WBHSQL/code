name: Inspect Add to Calendar for MiMo migration
on:
  push:
    branches: [codex/mimo-calendar-shortcut]
    paths:
      - '.github/workflows/mimo-calendar-audit.yml'
      - 'tools/mimo-calendar/**'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect original public shortcut
        run: python tools/mimo-calendar/inspect.py
