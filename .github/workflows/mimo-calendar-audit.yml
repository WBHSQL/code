name: Sign Add to Calendar MiMo shortcut on macOS
on:
  push:
    branches: [codex/mimo-calendar-shortcut]
    paths:
      - '.github/workflows/mimo-calendar-audit.yml'
      - 'tools/mimo-calendar/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify 820 original actions
        env:
          SKIP_HUBSIGN: '1'
        run: python tools/mimo-calendar/build.py
      - name: Sign with Apple's official shortcuts tool
        run: shortcuts sign --mode anyone --input dist/Add-to-Calendar-MiMo.unsigned.shortcut --output dist/Add-to-Calendar-MiMo.shortcut
      - name: Validate signed container
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/Add-to-Calendar-MiMo.shortcut')
          assert p.read_bytes()[:4]==b'AEA1'
          print('APPLE_SIGNATURE_OK',len(p.read_bytes()))
          PY
      - name: Downloadable iPhone shortcut
        uses: actions/upload-artifact@v4
        with:
          name: Add-to-Calendar-MiMo
          path: dist/Add-to-Calendar-MiMo.shortcut
          if-no-files-found: error
