name: Build Add to Calendar MiMo shortcut
on:
  push:
    branches: [codex/mimo-calendar-shortcut]
    paths:
      - '.github/workflows/mimo-calendar-audit.yml'
      - 'tools/mimo-calendar/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, validate and sign
        run: python tools/mimo-calendar/build.py
      - name: Downloadable iPhone shortcut
        uses: actions/upload-artifact@v4
        with:
          name: Add-to-Calendar-MiMo
          path: dist/Add-to-Calendar-MiMo.shortcut
          if-no-files-found: error
